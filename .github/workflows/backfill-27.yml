name: Backfill iOS 27 compact diffs

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backfill-ios-27-compact
  cancel-in-progress: false

jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - id: "01"
            prev: "24A5355q"
            next: "24A5370h"
          - id: "02"
            prev: "24A5370h"
            next: "24A5380h"
          - id: "03"
            prev: "24A5380h"
            next: "24A5390f"
          - id: "04"
            prev: "24A5390f"
            next: "24A5408d"
          - id: "05"
            prev: "24A5408d"
            next: "24A5418b"
          - id: "06"
            prev: "24A5418b"
            next: "24A5424a"
          - id: "07"
            prev: "24A5424a"
            next: "24A5430a"
          - id: "08"
            prev: "24A5430a"
            next: "24A435"
          - id: "09"
            prev: "24A435"
            next: "24A437"
          - id: "10"
            prev: "24A437"
            next: "24A446"
          - id: "11"
            prev: "24A437"
            next: "24B5084k"
          - id: "12"
            prev: "24B5084k"
            next: "24B5089g"
          - id: "13"
            prev: "24B5089g"
            next: "24B5099f"

    steps:
      - name: Checkout diff repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          swap-storage: false

      - name: Checkout compact-diff ipsw fork
        uses: actions/checkout@v4
        with:
          repository: satomasahiro2005/ipsw
          ref: diff-no-context
          path: .ipsw-src
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: .ipsw-src/go.mod
          cache-dependency-path: .ipsw-src/go.sum

      - name: Build forked ipsw
        run: |
          set -euo pipefail
          cd .ipsw-src
          go build -o /tmp/ipsw ./cmd/ipsw
          sudo install -m 0755 /tmp/ipsw /usr/local/bin/ipsw
          cd ..
          rm -rf .ipsw-src
          ipsw version

      - name: Cache AppleDB
        uses: actions/cache@v4
        with:
          path: ~/.config/ipsw
          key: appledb-${{ runner.os }}-ios27-backfill

      - name: Install apfs-fuse
        env:
          APFS_FUSE_SHA: 66b86bd525e8cb90f9012543be89b1f092b75cf3
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fuse3 libfuse3-dev libbz2-dev libattr1-dev zlib1g-dev cmake g++ git
          src="$RUNNER_TEMP/apfs-fuse"
          git clone --quiet https://github.com/sgan81/apfs-fuse.git "$src"
          git -C "$src" checkout --quiet "$APFS_FUSE_SHA"
          git -C "$src" submodule update --init --recursive --quiet
          cmake -S "$src" -B "$src/build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$src/build" --parallel "$(nproc)"
          sudo install -m 0755 "$src/build/apfs-fuse" /usr/local/bin/apfs-fuse

      - name: Fetch symbolicator signatures
        run: git clone --quiet --depth 1 https://github.com/blacktop/symbolicator.git "$RUNNER_TEMP/symbolicator"

      - name: Add swap
        run: |
          set -euo pipefail
          swapdir=/mnt
          df "$swapdir" >/dev/null 2>&1 || swapdir=/
          avail_g="$(df -P "$swapdir" | awk 'NR==2 {print int($4/1024/1024)}')"
          size_g=$(( avail_g - 10 ))
          [ "$size_g" -gt 28 ] && size_g=28
          if [ "$size_g" -ge 8 ]; then
            swapfile="$swapdir/swapfile"
            sudo fallocate -l "${size_g}G" "$swapfile" || \
              sudo dd if=/dev/zero of="$swapfile" bs=1M count=$(( size_g * 1024 ))
            sudo chmod 600 "$swapfile"
            sudo mkswap "$swapfile" >/dev/null
            sudo swapon "$swapfile"
          fi

      - name: Download and diff
        env:
          PREV_BUILD: ${{ matrix.prev }}
          NEXT_BUILD: ${{ matrix.next }}
          DEVICE: iPhone17,1
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prev_dir="$RUNNER_TEMP/prev"
          next_dir="$RUNNER_TEMP/next"
          out_dir="$RUNNER_TEMP/out"
          mkdir -p "$prev_dir" "$next_dir" "$out_dir"

          echo "::group::Download $PREV_BUILD"
          ipsw dl appledb \
            --os iOS \
            --device "$DEVICE" \
            --build "$PREV_BUILD" \
            --output "$prev_dir" \
            --confirm
          echo "::endgroup::"

          echo "::group::Download $NEXT_BUILD"
          ipsw dl appledb \
            --os iOS \
            --device "$DEVICE" \
            --build "$NEXT_BUILD" \
            --output "$next_dir" \
            --confirm
          echo "::endgroup::"

          echo "::group::Compact diff"
          ipsw diff --output "$out_dir" \
            --markdown \
            --fw \
            --launchd \
            --feat \
            --strs \
            --ent \
            --files \
            --starts \
            --signatures "$RUNNER_TEMP/symbolicator/kernel" \
            --block-list "__TEXT.__info_plist" \
            --block-list "__AUTH_CONST.__auth_ptr" \
            "$prev_dir"/*.ipsw \
            "$next_dir"/*.ipsw
          echo "::endgroup::"

      - name: Upload generated diff
        uses: actions/upload-artifact@v4
        with:
          name: ios27-diff-${{ matrix.id }}
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error
          retention-days: 3

  commit:
    needs: diff
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout diff repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Download completed diffs
        uses: actions/download-artifact@v4
        with:
          pattern: ios27-diff-*
          path: "$RUNNER_TEMP/backfill"
          merge-multiple: true

      - name: Replace generated iOS 27 directories
        run: |
          set -euo pipefail
          shopt -s nullglob
          dirs=("$RUNNER_TEMP"/backfill/*)
          if [ "${#dirs[@]}" -eq 0 ]; then
            echo "No completed diffs to commit"
            exit 0
          fi

          for src in "${dirs[@]}"; do
            [ -d "$src" ] || continue
            name="$(basename "$src")"
            case "$name" in
              27_*) ;;
              *)
                echo "::error::Unexpected output directory: $name"
                exit 1
                ;;
            esac
            rm -rf "iOS/$name"
            cp -a "$src" iOS/
          done

      - name: Commit regenerated diffs
        run: |
          set -euo pipefail
          git config user.name 'satomasahiro2005'
          git config user.email 'satomasahiro2005@users.noreply.github.com'
          git add iOS
          if git diff --cached --quiet; then
            echo "No generated diff changes"
            exit 0
          fi
          git commit -m "Regenerate iOS 27 diffs with compact context"
          git push origin HEAD:main
